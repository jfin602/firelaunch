AWSTemplateFormatVersion: '2010-09-09'
Description: Review-only FireLaunch private MediaConvert queue and event delivery; existing buckets and CDN are imported by name
Parameters:
  OriginalsBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  DeliveryBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  ControlPlaneRoleName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
Resources:
  BoundedQueue:
    Type: AWS::MediaConvert::Queue
    Properties:
      Name: !Sub '${AWS::StackName}-firelaunch'
      PricingPlan: ON_DEMAND
      ConcurrentJobs: 1
      Status: PAUSED
      Description: Paused until operator approves budget and FireLaunch admission is connected
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: mediaconvert.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fixed-source-private-staging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OriginalsBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DeliveryBucketName}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${OriginalsBucketName}/media/*/*/*/original/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DeliveryBucketName}/media/*/*/*/staged/*'
  ControlPlaneMediaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-media-control'
      Roles: [!Ref ControlPlaneRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt MediaConvertRole.Arn
            Condition:
              StringEquals: { 'iam:PassedToService': mediaconvert.amazonaws.com }
          - Effect: Allow
            Action: mediaconvert:CreateJob
            Resource: !GetAtt BoundedQueue.Arn
          - Effect: Allow
            Action: [mediaconvert:GetJob, mediaconvert:CancelJob]
            Resource: !Sub 'arn:${AWS::Partition}:mediaconvert:${AWS::Region}:${AWS::AccountId}:jobs/*'
          - Effect: Allow
            Action: mediaconvert:ListJobs
            Resource: '*'
            Condition:
              StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage]
            Resource: !GetAtt MediaConvertEventsQueue.Arn
  MediaConvertEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDeadLetterQueue.Arn
        maxReceiveCount: 5
  EventDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  MediaConvertEvents:
    Type: AWS::Events::Rule
    Properties:
      State: DISABLED
      Description: Operator enables only after P3 signed GetJob correlation and replay are wired
      EventPattern:
        source: [aws.mediaconvert]
        detail-type: [MediaConvert Job State Change]
        account: [!Ref 'AWS::AccountId']
        region: [!Ref 'AWS::Region']
        detail:
          queue: [!GetAtt BoundedQueue.Arn]
          status: [PROGRESSING, COMPLETE, ERROR, CANCELED]
      Targets:
        - Id: private-job-event
          Arn: !GetAtt MediaConvertEventsQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventDeadLetterQueue.Arn
          RetryPolicy:
            MaximumRetryAttempts: 3
            MaximumEventAgeInSeconds: 3600
  EventDeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref MediaConvertEventsQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt MediaConvertEventsQueue.Arn
            Condition:
              ArnEquals: { 'aws:SourceArn': !GetAtt MediaConvertEvents.Arn }
  EventBridgeDeadLetterPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EventDeadLetterQueue.Arn
            Condition:
              ArnEquals: { 'aws:SourceArn': !GetAtt MediaConvertEvents.Arn }
Outputs:
  QueueArn: { Value: !GetAtt BoundedQueue.Arn }
  EventQueueUrl: { Value: !Ref MediaConvertEventsQueue }
  DeadLetterQueueArn: { Value: !GetAtt EventDeadLetterQueue.Arn }
